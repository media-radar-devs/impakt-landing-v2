<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/impakt.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lectura sistemática de los medios chilenos. Cobertura editorial continua, análisis de coyuntura, sectores y actores."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Seguridad -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Canonical -->
    <link rel="canonical" href="https://impaktmedia.cl/" />
    <!-- Open Graph -->
    <meta property="og:title" content="Impakt — Lectura sistemática de los medios chilenos" />
    <meta property="og:description" content="Lectura sistemática de los medios chilenos. Cobertura editorial continua, análisis de coyuntura, sectores y actores." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://impaktmedia.cl/" />
    <meta property="og:image" content="https://impaktmedia.cl/impakt.png" />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Impakt — Lectura sistemática de los medios chilenos" />
    <meta name="twitter:description" content="Lectura sistemática de los medios chilenos. Cobertura editorial continua, análisis de coyuntura, sectores y actores." />
    <meta name="twitter:image" content="https://impaktmedia.cl/impakt.png" />
    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://impaktmedia.cl/#organization",
          "name": "Impakt Media",
          "url": "https://impaktmedia.cl",
          "logo": "https://impaktmedia.cl/impakt.png",
          "description": "Servicio chileno de cobertura editorial sobre los medios digitales. Lectura sistemática de la agenda mediática nacional para equipos profesionales.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Santiago",
            "addressCountry": "CL"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "equipo@impaktmedia.cl",
            "contactType": "customer service"
          },
          "sameAs": [
            "https://www.linkedin.com/company/impakt-media-cl",
            "https://x.com/impaktmediacl"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://impaktmedia.cl/#website",
          "url": "https://impaktmedia.cl",
          "name": "Impakt Media",
          "publisher": { "@id": "https://impaktmedia.cl/#organization" }
        }
      ]
    }
    </script>
    <title>Impakt — Lectura sistemática de los medios chilenos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
